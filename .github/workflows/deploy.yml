# Checks every push and pull request, and deploys main to Cloudflare.
#
# The game is served by two Cloudflare projects that were set up by direct
# upload with Wrangler: the `pieces-of-home` Worker (co-op rooms and the API)
# and the `piecesofhome` Pages project (https://piecesofhome.pages.dev).
# Cloudflare cannot attach a Git repository to a Pages project that was made by
# direct upload, so this workflow runs the same `npm run deploy` the team runs
# by hand, from this repository, and the URL stays the same.
#
# Needs one repository secret, CLOUDFLARE_API_TOKEN (Workers Scripts: Edit and
# Cloudflare Pages: Edit), and the repository variable CLOUDFLARE_ACCOUNT_ID.
# Without the token the checks still run and the deploy step is skipped.
name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:facts
      - run: npm run typecheck
      - run: npm run test

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy the Worker and the Pages site
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run deploy
      - name: Check the live site
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: curl -fsS https://piecesofhome.pages.dev/api/health
      - name: No token yet
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN is not set, so this run checked the code and skipped the deploy. See MY_TASKS.md."
